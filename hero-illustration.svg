<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9fafb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles in background -->
  <circle cx="120" cy="80" r="60" fill="#2563eb" opacity="0.05"/>
  <circle cx="680" cy="420" r="80" fill="#2563eb" opacity="0.05"/>
  <circle cx="700" cy="100" r="40" fill="#6366f1" opacity="0.05"/>
  
  <!-- Main access card (center) -->
  <g transform="translate(200, 100)">
    <!-- Card shadow -->
    <rect x="4" y="4" width="400" height="280" rx="16" fill="#000000" opacity="0.08"/>
    
    <!-- Card -->
    <rect width="400" height="280" rx="16" fill="url(#cardGradient)" stroke="#e5e7eb" stroke-width="2"/>
    
    <!-- Card header -->
    <rect width="400" height="60" rx="16" fill="#2563eb" opacity="0.08"/>
    <text x="20" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
      My Access Card
    </text>
    <rect x="300" y="20" width="80" height="24" rx="12" fill="#dbeafe"/>
    <text x="308" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563eb">
      Medical
    </text>
    
    <!-- Card content with lines representing text -->
    <text x="20" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1f2937">
      What helps me
    </text>
    <rect x="20" y="100" width="340" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="20" y="115" width="280" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="20" y="130" width="300" height="8" rx="4" fill="#e5e7eb"/>
    
    <text x="20" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1f2937">
      What to avoid
    </text>
    <rect x="20" y="180" width="320" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="20" y="195" width="260" height="8" rx="4" fill="#e5e7eb"/>
    
    <!-- Share icon in corner -->
    <circle cx="365" cy="250" r="18" fill="#2563eb"/>
    <path d="M365 243 l5 3 l-5 3 M360 246 l10 0" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Floating profile card (top left) -->
  <g transform="translate(50, 80)">
    <rect width="140" height="100" rx="12" fill="white" stroke="#e5e7eb" stroke-width="2" opacity="0.9"/>
    <circle cx="40" cy="35" r="18" fill="#dbeafe"/>
    <path d="M40 29 c-3 0-5 2-5 5 s2 5 5 5 s5-2 5-5 s-2-5-5-5 z M40 40 c-4 0-8 2-10 5 h20 c-2-3-6-5-10-5" fill="#2563eb"/>
    <rect x="65" y="25" width="60" height="6" rx="3" fill="#e5e7eb"/>
    <rect x="65" y="36" width="45" height="6" rx="3" fill="#e5e7eb"/>
    <rect x="20" y="60" width="100" height="6" rx="3" fill="#dbeafe"/>
    <rect x="20" y="72" width="80" height="6" rx="3" fill="#dbeafe"/>
  </g>
  
  <!-- Floating medication card (bottom right) -->
  <g transform="translate(600, 320)">
    <rect width="150" height="120" rx="12" fill="white" stroke="#e5e7eb" stroke-width="2" opacity="0.9"/>
    <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2937">
      💊 Medications
    </text>
    <rect x="15" y="35" width="120" height="6" rx="3" fill="#e5e7eb"/>
    <circle cx="20" cy="54" r="4" fill="#059669"/>
    <rect x="30" y="50" width="80" height="6" rx="3" fill="#e5e7eb"/>
    <circle cx="20" cy="69" r="4" fill="#059669"/>
    <rect x="30" y="65" width="90" height="6" rx="3" fill="#e5e7eb"/>
    <circle cx="20" cy="84" r="4" fill="#059669"/>
    <rect x="30" y="80" width="70" height="6" rx="3" fill="#e5e7eb"/>
    <rect x="15" y="100" width="120" height="8" rx="4" fill="#dbeafe"/>
  </g>
  
  <!-- Connection lines (subtle) -->
  <path d="M 190 130 Q 250 150 300 180" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" fill="none"/>
  <path d="M 600 280 Q 550 300 500 320" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" fill="none"/>
  
  <!-- Checkmark badges (showing completion/success) -->
  <circle cx="100" cy="380" r="20" fill="#059669"/>
  <path d="M 93 380 l 5 5 l 10 -10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <circle cx="700" cy="200" r="20" fill="#059669"/>
  <path d="M 693 200 l 5 5 l 10 -10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Text label at bottom -->
  <text x="400" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#6b7280" text-anchor="middle">
    Organize once. Share everywhere. Stay supported.
  </text>
</svg>
